# Setup warnings (spoken and shown on first run / missing configuration)
speech.notOdyssey=警告、コマンダー。ゲームがOdysseyで起動していません。このアプリケーションはElite Dangerous Odyssey用に作られており、Horizonsでは多くの機能が動作しません。
speech.setup.noLlm=警告、コマンダー。言語モデルが設定されていないため、あなたの言葉を理解することも、答えることもできません。無料のMistralプランを設定するか、ローカルのGemma 4 E4Bモデルをインストールしてください。手順はelite intel dot orgに記載されています。初フライト前に音声キャリブレーションも強く推奨します。
speech.setup.noJournals=警告、コマンダー。指定された場所にElite Dangerousのジャーナルファイルが見つかりません。ジャーナルフォルダを正しく設定するまで、あなたの船の周りで起きていることが一切分かりません。設定タブで指定できます。
speech.setup.noBindings=警告、コマンダー。指定された場所にコントロールバインドが見つかりません。バインドフォルダを正しく設定するまで、あなたの船を操作できません。バインドタブで指定できます。

