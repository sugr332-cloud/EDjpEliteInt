name: ccore-checks

on:
  pull_request:
    paths: ["c-core/**", ".github/workflows/ccore-checks.yml"]
  push:
    branches: [main]
    paths: ["c-core/**", ".github/workflows/ccore-checks.yml"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install c-core and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run pytest
        run: python -m pytest -q
